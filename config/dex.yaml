# dex — demo IdP for the A6 OIDC flow (E4: dex first on the IdP ladder;
# Zitadel/Keycloak are the operated enterprise rungs — only dex ships here).
#
# DEMO configuration for the compose stack on localhost. Everything in this
# file is demo material for the fictional company Nordfels IT GmbH: the
# client secret and the user passwords are DOCUMENTED demo credentials, not
# real secrets — production uses the operator's IdP, never this file.
#
# The issuer is the PUBLIC (browser-facing) URL and becomes the iss claim.
# Containers reach dex over http://dex:5556/dex (OIDC_INTERNAL_ISSUER_URL);
# the API rewrites only its backchannel fetches — iss stays this URL.
issuer: http://localhost:5556/dex

storage:
  # sqlite file inside the container — demo scope; dex state is disposable.
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  # Demo UX: no consent screen between login and redirect.
  skipApprovalScreen: true

staticClients:
  - id: rag-assistant
    name: Enterprise RAG Assistant
    redirectURIs:
      - http://localhost:8000/auth/callback
    # DEMO secret (matches OIDC_CLIENT_SECRET in .env.example) — documented
    # on purpose, carries no protection value outside localhost.
    secret: nordfels-demo-oidc-secret

# Static demo users (fictional @nordfels.example domain — repo rule: nothing
# real). staticPasswords CANNOT carry custom claims — that is why the demo
# department bridge (OIDC_DEMO_DEPARTMENT_MAP, forbidden in production via
# readiness R10) exists on the API side.
enablePasswordDB: true
staticPasswords:
  # password: nordfels-anna
  - email: anna@nordfels.example
    hash: "$2b$10$/NrhZDgMHD6OQA4bhkzE0exDpoZ4Cl.xbBDcmdmrUd12cjq9d4vcC"
    username: anna
    userID: 3f7a1c2e-8d4b-4a5e-9c6f-1a2b3c4d5e6f
  # password: nordfels-ben
  - email: ben@nordfels.example
    hash: "$2b$10$uSorWqGDRan6cE/WiBNFVe6JpcgyRG.q31WjH9cJzfe6qc7QFQuEO"
    username: ben
    userID: 7b9d2e4f-1a3c-4d5e-8f6a-2b3c4d5e6f7a
