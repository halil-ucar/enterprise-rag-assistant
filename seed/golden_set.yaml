# Golden set — designed BEFORE the corpus; every architecture feature has a proving case.
# Anchors are doc_id + section substring (chunking-independent — chunk ids change
# with every chunking strategy, sections don't).
#
# categories:
#   error_code   → lexical leg must win (exact term)
#   paraphrase   → dense leg must win (no word overlap)
#   table        → table-as-chunk parsing
#   compound     → German compound word (FTS gap, dense compensates)
#   multi_doc    → agentic path (hard: true)
#   rls          → department scoping (user: ben vs anna)
#   unanswerable → refusal contract
#   injection    → embedded instruction treated as data

questions:
  - id: q01
    category: error_code
    question: "Was bedeutet der VPN-Fehler NF-4102?"
    expected_doc: vpn-handbuch
    expected_section_contains: "Fehlerbehebung"
    expected_answer_contains: ["Zertifikat", "abgelaufen"]
  - id: q02
    category: error_code
    question: "Was tun bei Fehlercode NF-4315?"
    expected_doc: vpn-handbuch
    expected_section_contains: "Fehlerbehebung"
    expected_answer_contains: ["Passwort", "Sperre"]
  - id: q03
    category: table
    question: "Welches Papier braucht der Etikettendrucker im Lager?"
