[project]
name = "rag-assistant"
version = "0.1.0"
description = "RAG-based knowledge assistant for enterprises: hybrid search with reranking, validated source citations, row-level security, local-only processing for confidential data, prompt-injection hardening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Halil Ucar" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "openai>=1.40",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.3",
    "python-multipart>=0.0.9",
    "prometheus_client>=0.20",
    # A6 (E5): ONE entry — the crypto extra pulls cryptography for RS256/ES256
    # signature verification; no third standalone library.
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# Heavy ML stack (torch). Needed for real embeddings + reranker.
# Unit tests and CI run WITHOUT this via deterministic fakes.
ml = [
    "sentence-transformers>=3.0",
]
# PDF parsing (Docling downloads layout models on first run).
# Without it, the ingestion worker falls back to Markdown passthrough.
parsing = [
    "docling>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "reportlab>=4.0",   # seed corpus PDF generation
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live Postgres + Redis (docker compose / CI services)",
    "ollama: needs a live Ollama server (run on the owner's Mac)",
    "dex: needs the compose dex IdP (owner's Mac)",
]
addopts = "-m 'not integration and not ollama and not dex'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (Depends/Header in defaults) is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["rag_assistant"]
ignore_missing_imports = true
check_untyped_defs = true
